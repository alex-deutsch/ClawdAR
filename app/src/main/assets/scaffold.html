<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ClawdAR Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #status-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 24px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #status-container.visible {
            opacity: 1;
        }

        #status-container.info {
            color: #00FF88;
        }

        #status-container.error {
            color: #FF4444;
        }

        #status-container.warning {
            color: #FFAA00;
        }

        #welcome {
            text-align: center;
        }

        #welcome img {
            width: 120px;
            height: auto;
            margin-bottom: 16px;
        }

        #welcome h1 {
            font-size: 48px;
            font-weight: 300;
            color: #FF6B35;
            margin-bottom: 16px;
        }

        #welcome p {
            font-size: 28px;
            color: #aaa;
            line-height: 1.6;
        }

        /* Loading/Thinking animation */
        .loading-indicator {
            display: inline-block;
            text-align: center;
            padding: 16px;
        }

        .loading-indicator .loading-text {
            color: #FF6B35;
            font-size: 18px;
            margin-top: 8px;
        }

        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(17, 17, 17, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        /* Eye content styling */
        .eye-content {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .welcome h1 {
            font-size: 36px;
            font-weight: 300;
            color: #00FF88;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome p {
            font-size: 20px;
            color: #888;
            text-align: center;
        }

        /* A2UI Content Area - mirrored in both eyes */
        #a2ui-root {
            position: absolute;
            top: 60px;
            left: 10px;
            right: 10px;
            bottom: 60px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        #a2ui-root.active {
            display: block;
        }

        /* Debug mode styling */
        body.debug #debug-info {
            display: block;
        }

        #debug-info {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 10px;
            color: #888;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <!-- Welcome content is now handled by native Compose layer -->
    </div>

    <div id="a2ui-root"></div>

    <div id="status-container"></div>

    <script>
        // ClawdAR Canvas API
        (function() {
            'use strict';

            const statusContainer = document.getElementById('status-container');
            const a2uiRoot = document.getElementById('a2ui-root');

            let statusTimeout = null;

            // Global ClawdBot API
            globalThis.__clawdbot = {
                setStatus: function(text, type) {
                    type = type || 'info';
                    statusContainer.textContent = text;
                    statusContainer.className = 'visible ' + type;

                    clearTimeout(statusTimeout);
                    statusTimeout = setTimeout(function() {
                        statusContainer.classList.remove('visible');
                    }, 3000);
                },

                setDebugStatusEnabled: function(enabled) {
                    document.body.classList.toggle('debug', enabled);
                }
            };

            // A2UI API (Agent-to-UI)
            globalThis.clawdbotA2UI = {
                applyMessages: function(messagesJson) {
                    console.log('A2UI applyMessages called with:', messagesJson);
                    try {
                        const messages = JSON.parse(messagesJson);
                        console.log('Parsed messages:', messages);

                        a2uiRoot.classList.add('active');
                        a2uiRoot.style.display = 'block';

                        // Process messages
                        let html = '';
                        if (Array.isArray(messages)) {
                            messages.forEach(function(msg) {
                                console.log('Processing message:', msg);
                                if (msg.type === 'text') {
                                    html += '<div style="padding: 8px; color: #fff; font-size: 20px;">' +
                                            escapeHtml(msg.content || '') + '</div>';
                                } else if (msg.type === 'markdown') {
                                    html += '<div style="padding: 8px; color: #fff; font-size: 20px;">' +
                                            simpleMarkdown(msg.content || '') + '</div>';
                                }
                            });
                        } else if (typeof messages === 'string') {
                            html = '<div style="padding: 8px; color: #fff; font-size: 20px;">' +
                                   simpleMarkdown(messages) + '</div>';
                        }

                        console.log('Generated HTML:', html);
                        a2uiRoot.innerHTML = html;
                        return true;
                    } catch (e) {
                        console.error('A2UI error:', e);
                        a2uiRoot.innerHTML = '<div style="padding: 8px; color: red; font-size: 18px;">Error: ' + e.message + '</div>';
                        a2uiRoot.style.display = 'block';
                        return false;
                    }
                },

                reset: function() {
                    a2uiRoot.innerHTML = '';
                    a2uiRoot.classList.remove('active');
                }
            };

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function simpleMarkdown(text) {
                return escapeHtml(text)
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/`(.*?)`/g, '<code style="background:#333;padding:2px 4px;border-radius:2px;">$1</code>')
                    .replace(/\n/g, '<br>');
            }

            // Ready notification
            console.log('ClawdAR Canvas ready');

            // Notify Android that page is ready
            if (window.__clawdbotAndroid) {
                window.__clawdbotAndroid.onA2UIAction(JSON.stringify({ type: 'ready' }));
            }
        })();
    </script>
</body>
</html>
